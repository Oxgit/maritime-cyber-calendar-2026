{{ define "main" }}
<div class="container page-content">
    <article class="content">
        <h1>{{ .Title }}</h1>
        {{ .Content }}
    </article>
</div>

<style>
.page-content {
    padding: 60px 20px;
    max-width: 800px;
}

.content h1 {
    font-size: 2.5rem;
    margin-bottom: 30px;
    color: var(--accent-tertiary);
}

.content h2 {
    font-size: 1.5rem;
    margin: 40px 0 20px;
    color: var(--color-text-primary);
}

.content p {
    margin-bottom: 20px;
    color: var(--color-text-secondary);
    line-height: 1.8;
}

.content ul, .content ol {
    margin-bottom: 20px;
    padding-left: 30px;
    color: var(--color-text-secondary);
}

.content li {
    margin-bottom: 10px;
}

.content table {
    width: 100%;
    border-collapse: collapse;
    margin: 30px 0;
}

.content th, .content td {
    padding: 12px 15px;
    border: 1px solid var(--color-border);
    text-align: left;
}

.content th {
    background: var(--card-bg);
    color: var(--accent-primary);
}

.content td {
    color: var(--color-text-secondary);
}

.content a {
    color: var(--link-color);
}

.content a:hover {
    color: var(--link-color-hover);
    text-decoration: underline;
}

.content hr {
    border: none;
    border-top: 1px solid var(--color-border);
    margin: 40px 0;
}

.content em {
    color: var(--color-text-muted);
}

.content code {
    background: var(--card-bg);
    padding: 2px 8px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 0.9em;
}
</style>
{{ end }}
