<header class="header">
    <nav class="nav container">
        <a href="{{ .Site.Home.RelPermalink }}" class="logo">
            <span class="logo-icon">🚢</span>
            <span class="logo-text">Maritime Ogmios</span>
            {{ with .Site.Params.theme.badgeLabel }}
            <span class="site-badge site-badge--{{ $.Site.Params.theme.badgeStyle | default "filled" }}">{{ . }}</span>
            {{ end }}
        </a>
        <a href="https://maritime-ogmios.tech" class="hub-link" rel="noopener" title="Maritime Ogmios Cybersecurity Hub">⚓ Hub</a>
        <div class="nav-right">
            <ul class="nav-links">
                {{ range .Site.Menus.main }}
                <li><a href="{{ .URL }}">{{ .Name }}</a></li>
                {{ end }}
            </ul>
            <div class="lang-switcher">
                {{ range .Site.Home.AllTranslations }}
                <a href="{{ .RelPermalink }}" class="lang-link {{ if eq .Language.Lang $.Site.Language.Lang }}active{{ end }}" title="{{ .Language.LanguageName }}">
                    {{ if eq .Language.Lang "en" }}🇬🇧{{ else if eq .Language.Lang "pl" }}🇵🇱{{ end }}
                </a>
                {{ end }}
            </div>
        </div>
    </nav>
</header>
