[build]
  publish = "public"
  command = "hugo --minify"
  # ⛔ NIE przywracaj tu reguły `ignore` bez sprawdzenia logu builda.
  # Reguła "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- content/ ..."
  # anulowała KAŻDY deploy z komunikatem "Canceled build due to no content
  # change" — potwierdzone 2026-04-02, 2026-06-29 i dwukrotnie 2026-08-11,
  # także po zabezpieczeniu warunkiem `test -n "$CACHED_COMMIT_REF"`.
  # Anulowany build nie odświeża cache, więc stan sam się utrwalał i treść
  # wchodziła na produkcję dopiero ręcznym deployem z panelu.
  # Build tej strony trwa ~1 s (11 podstron), więc oszczędność była pozorna.

[build.environment]
  HUGO_VERSION = "0.145.0"

[context.production.environment]
  HUGO_ENV = "production"

# Wyłącz deploy previews (każdy PR = osobny build = kredyty)
[context.deploy-preview]
  ignore = "true"

# Wyłącz branch deploys
[context.branch-deploy]
  ignore = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://plausible.io; frame-ancestors 'none'"
